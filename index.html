<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>F/A-18 Interceptor</title>
<meta name="description" content="A from-scratch remake of the 1988 Amiga flight simulator F/A-18 Interceptor: software-rendered 3D over the real San Francisco Bay, with an emulated Amiga Paula sound chip.">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;color:#999;font:14px/1.4 ui-monospace,Menlo,Consolas,monospace}
  canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;image-rendering:pixelated;background:#000;outline:none;touch-action:none;-webkit-tap-highlight-color:transparent}
  noscript{position:absolute;inset:0;display:grid;place-items:center}
</style>
</head>
<body>
<canvas id="screen" tabindex="0"></canvas>
<noscript>F/A-18 Interceptor needs JavaScript.</noscript>
<script src="game.js"></script>
</body>
</html>
